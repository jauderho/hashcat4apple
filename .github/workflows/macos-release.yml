name: macOS release
# Keep this exactly "Build <tag>": sync-upstream.yml matches the run title with
# grep -qxF to avoid dispatching a second build for a tag already in flight.
run-name: "Build ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "hashcat release tag to build (vX.Y.Z, v7.0.0 or newer)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Validate tag and check for existing release
        id: check
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected vX.Y.Z)"
            exit 1
          fi
          NUM=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          if (( NUM < 70000 )); then
            echo "::error::only v7.0.0 and above are built"
            exit 1
          fi
          if [[ -z "$(git ls-remote --tags https://github.com/hashcat/hashcat.git "refs/tags/$TAG")" ]]; then
            echo "::error::tag '$TAG' does not exist upstream"
            exit 1
          fi
          # a draft left by a failed run doesn't count; the build replaces it
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            echo "release $TAG already exists; nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write  # create the release
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # GitHub-hosted macOS runners support audit mode only
          egress-policy: audit
          disable-telemetry: true

      - name: Check out hashcat source at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # built straight from upstream: hashcat's tags touch .github/workflows/,
          # so GITHUB_TOKEN cannot mirror them into this repo (see sync-upstream.yml)
          repository: hashcat/hashcat
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test
        run: |
          ./hashcat --version
          ./hashcat --help > /dev/null

      - name: Package
        run: |
          NAME="hashcat-$TAG-macos-arm64"
          DIST="$RUNNER_TEMP/dist"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$DIST" "$STAGE"
          # binary plus everything it loads at runtime relative to itself
          for f in hashcat hashcat.hcstat2 example.dict example*.* \
                   OpenCL Python Rust bridges charsets docs extra include \
                   layouts masks modules rules tools tunings README.md; do
            [[ -e "$f" ]] && cp -R "$f" "$STAGE/"
          done
          # keep only the shared libraries the Rust bridges load from cargo's
          # target/release; the rest is build output (build_script_build-*, ...)
          find "$STAGE" -type d -name target -path '*/Rust/*' -prune | while read -r T; do
            mv "$T" "$T.full"
            mkdir -p "$T/release"
            find "$T.full/release" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) -exec cp {} "$T/release/" \;
            rm -rf "$T.full"
          done
          tar -C "$RUNNER_TEMP" -czf "$DIST/$NAME.tar.gz" "$NAME"
          (cd "$DIST" && shasum -a 256 *.tar.gz > SHA256SUMS)
          cat "$DIST/SHA256SUMS"

      - name: Create release
        run: |
          {
            echo "hashcat $TAG built from upstream tag \`$TAG\` (hashcat/hashcat@$(git rev-parse HEAD))"
            echo "for macOS on Apple Silicon (runner: \`$ImageOS\`)."
            echo
            echo "The binaries are not code-signed; after extracting run:"
            echo '```'
            echo "xattr -dr com.apple.quarantine hashcat-$TAG-macos-arm64"
            echo '```'
            echo
            echo "Upstream release notes: https://github.com/hashcat/hashcat/releases/tag/$TAG"
          } > "$RUNNER_TEMP/notes.md"
          # releases are immutable once published, so attach every asset to a
          # draft first and publish last
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "hashcat $TAG (macOS Apple Silicon)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/dist/*
          # builds can finish out of order; only the highest version is Latest
          HIGHEST=$( { gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'; echo "$TAG"; } | sort -V | tail -1)
          gh release edit "$TAG" --draft=false --latest="$([[ "$HIGHEST" == "$TAG" ]] && echo true || echo false)"
