name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

# Unlike FFmpeg (whose CI lives in .forgejo/), hashcat keeps its CI in
# .github/workflows/, and GITHUB_TOKEN may not push any commit or ref that
# touches those files. So upstream refs are never pushed as-is: master gets a
# snapshot commit of upstream's tree with our own .github/workflows/ kept, and
# release tags are created by the build workflow on that commit.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      # pin gh to this repo: it would otherwise resolve the git remote
      # named "upstream" (hashcat/hashcat) added below
      GH_REPO: ${{ github.repository }}
      UPSTREAM: https://github.com/hashcat/hashcat.git
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Fetch upstream master
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags --depth 1 upstream "+refs/heads/master:refs/remotes/upstream/master"

      - name: Snapshot upstream master, keeping our workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UP=$(git rev-parse upstream/master)
          git read-tree upstream/master
          git rm -r -q --cached --ignore-unmatch .github/workflows
          git read-tree --prefix=.github/workflows/ HEAD:.github/workflows
          TREE=$(git write-tree)
          if [[ "$TREE" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "master already matches upstream ${UP:0:10}"
            exit 0
          fi
          COMMIT=$(git commit-tree "$TREE" -p HEAD -m "Sync upstream hashcat/hashcat@${UP:0:10}" -m "Upstream-Commit: $UP")
          git reset -q --hard "$COMMIT"
          git push origin HEAD:master

      - name: Dispatch builds for unreleased tags (v7.0.0 and above)
        run: |
          MIN=70000  # v7.0.0
          ACTIVE=$(gh run list --workflow macos-release.yml --limit 100 --json displayTitle,status \
            --jq '.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting") | .displayTitle')
          for TAG in $(git ls-remote --tags upstream 'v*' | grep -v '\^{}' | sed 's|.*refs/tags/||' | sort -V); do
            [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
            NUM=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
            (( NUM >= MIN )) || continue
            if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
              continue
            fi
            if grep -qxF "Build $TAG" <<< "$ACTIVE"; then
              echo "build for $TAG already queued or running"
              continue
            fi
            echo "dispatching build for $TAG"
            gh workflow run macos-release.yml --ref master -f tag="$TAG"
          done
